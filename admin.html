<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KotaPal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --gray: #6b7280;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: #333;
        }
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        .login-card h1 { margin-bottom: 8px; font-size: 1.5rem; }
        .login-card p { color: var(--gray); margin-bottom: 24px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(to right, var(--primary), #8b5cf6);
            color: white;
        }
        .btn:hover { opacity: 0.95; }
        .btn-secondary { background: #e5e7eb; color: #374151; margin-top: 12px; text-decoration: none; text-align: center; }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; }
        .status.show { display: block; }
        .status.error { background: #fee2e2; color: #b91c1c; }
        .status.success { background: #d1fae5; color: #065f46; }
        a.btn-secondary:hover { opacity: 0.95; }

        #admin-view { display: none; padding: 40px 20px; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
        #admin-view.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .admin-header h1 { font-size: 1.75rem; }
        .admin-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; overflow: hidden; }
        .admin-card-header { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
        .admin-table { width: 100%; border-collapse: collapse; }
        .admin-table th, .admin-table td { padding: 14px 20px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .admin-table th { background: #f9fafb; font-size: 0.875rem; color: var(--gray); }
        .admin-table tr:hover { background: #f9fafb; }
        .admin-stat { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .admin-stat-label { font-size: 0.875rem; color: var(--gray); }
    </style>
</head>
<body>
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <h1><i class="fas fa-shield-alt"></i> Admin Login</h1>
            <p>Sign in with an admin account to access the dashboard.</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
                <a href="index.html" class="btn btn-secondary">Return to Home</a>
                <div id="adminLoginStatus" class="status"></div>
            </form>
        </div>
    </div>

    <div id="admin-view" style="display: none;">
        <div class="admin-header">
            <h1><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="adminEmailDisplay" style="color: var(--gray); font-size: 0.9rem;"></span>
                <button type="button" class="btn btn-secondary" id="adminLogoutBtn" style="width: auto; padding: 10px 20px;"><i class="fas fa-sign-out-alt"></i> Return to Home</button>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px;">
            <div class="admin-card" style="padding: 24px;">
                <div class="admin-stat" id="admin-stat-users">0</div>
                <div class="admin-stat-label">Total Users</div>
            </div>
        </div>
        <div class="admin-card">
            <div class="admin-card-header">All Users (Live from Firebase)</div>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr><th>Email</th><th>Name</th><th>Plan</th><th>Joined</th><th>Last Sign In</th></tr>
                    </thead>
                    <tbody id="adminUsersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCNU1QFZhmUuk2QWDeNi4ff3-le4KNnbrU",
            authDomain: "kotapal-1e8f6.firebaseapp.com",
            projectId: "kotapal-1e8f6",
            storageBucket: "kotapal-1e8f6.firebasestorage.app",
            messagingSenderId: "487227333489",
            appId: "1:487227333489:web:a370f5e07b9e4c3d79f4d0",
            measurementId: "G-8GQ7JGDZ7P"
        };

        const ADMIN_EMAILS = ['admin@kotapal.com', 'wreck@gmail.com', 'earlhugue@gmail.com', 'emmanuelmobinzo222@gmail.com', 'emmanuelmobinzo21@gmail.com'];

        function isAdminUser(email) {
            if (!email) return false;
            return ADMIN_EMAILS.includes(email.toLowerCase());
        }

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('login-screen');
            const adminView = document.getElementById('admin-view');
            if (user && isAdminUser(user.email)) {
                loginScreen.style.display = 'none';
                adminView.style.display = 'block';
                adminView.classList.add('active');
                document.getElementById('adminEmailDisplay').textContent = user.email;
                loadAdminUsers();
            } else {
                loginScreen.style.display = 'flex';
                adminView.style.display = 'none';
                if (user) auth.signOut();
            }
        });

        async function loadAdminUsers() {
            const tbody = document.getElementById('adminUsersTableBody');
            if (!tbody) return;
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">Loading users...</td></tr>';
            let users = [];
            try {
                // Try Cloud Function first (merges Firebase Auth + Firestore)
                const listAllUsers = firebase.functions().region('us-central1').httpsCallable('listAllUsers');
                const result = await listAllUsers();
                users = result.data?.users || [];
            } catch (err) {
                console.warn('listAllUsers failed, falling back to Firestore:', err);
                try {
                    // Fallback: read directly from Firestore users collection
                    const snap = await db.collection('users').get();
                    users = snap.docs.map(function(d) {
                        var data = d.data();
                        return {
                            id: d.id,
                            email: data.email || '-',
                            name: data.displayName || data.name || '-',
                            plan: data.plan || 'starter',
                            joined: data.signupDate || data.createdAt || '-',
                            lastSignIn: data.lastSignIn || '-'
                        };
                    });
                } catch (fsErr) {
                    console.error('Firestore fallback error:', fsErr);
                }
            }
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">No users found. Deploy Cloud Function: firebase deploy --only functions</td></tr>';
            } else {
                tbody.innerHTML = users.map(function(u) {
                    var joined = (u.joined && u.joined !== '-') ? new Date(u.joined).toLocaleDateString() : (u.joined || '-');
                    var lastSignIn = (u.lastSignIn && u.lastSignIn !== '-') ? new Date(u.lastSignIn).toLocaleDateString() : (u.lastSignIn || '-');
                    return '<tr><td>' + (u.email || '-') + '</td><td>' + (u.name || '-') + '</td><td>' + (u.plan || '-') + '</td><td>' + joined + '</td><td>' + lastSignIn + '</td></tr>';
                }).join('');
            }
            var statEl = document.getElementById('admin-stat-users');
            if (statEl) statEl.textContent = users.length;
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const statusEl = document.getElementById('adminLoginStatus');
            if (!email || !password) {
                statusEl.textContent = 'Please enter email and password.';
                statusEl.className = 'status show error';
                return;
            }
            if (!isAdminUser(email)) {
                statusEl.textContent = 'Admin access required. This account is not authorized.';
                statusEl.className = 'status show error';
                return;
            }
            try {
                await auth.signInWithEmailAndPassword(email, password);
                statusEl.textContent = 'Login successful!';
                statusEl.className = 'status show success';
            } catch (err) {
                statusEl.textContent = err.message || 'Login failed.';
                statusEl.className = 'status show error';
            }
        });

        document.getElementById('adminLogoutBtn').addEventListener('click', () => {
            auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
