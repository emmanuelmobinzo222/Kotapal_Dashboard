<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin Account - KotaPal</title>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            max-width: 420px;
            width: 100%;
        }
        h1 { margin-bottom: 8px; font-size: 1.5rem; }
        p { color: #6b7280; margin-bottom: 24px; font-size: 0.9rem; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            color: white;
            margin-bottom: 12px;
        }
        .btn:hover { opacity: 0.95; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-secondary { background: #e5e7eb; color: #374151; }
        .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 0.9rem; display: none; }
        .status.show { display: block; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #b91c1c; }
        a { color: #3b82f6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Admin Account</h1>
        <p>This will create admin@kotapal.com in Firebase Auth and add it to config/admins. Run once, then use <a href="index.html#admin">Admin login</a> to sign in.</p>
        <p><strong>Prerequisite:</strong> Deploy Firestore rules first: <code>firebase deploy --only firestore</code></p>
        <button type="button" class="btn" id="createBtn">Create admin@kotapal.com (Admin123!)</button>
        <a href="index.html#admin" class="btn btn-secondary" style="text-align:center;text-decoration:none;">Back to Admin Login</a>
        <div id="status" class="status"></div>
    </div>
    <script>
        const firebaseConfig = window.FIREBASE_CONFIG || {};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const ADMIN_EMAIL = 'admin@kotapal.com';
        const ADMIN_PASSWORD = 'Admin123!';

        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status show ' + type;
        }

        document.getElementById('createBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Creating...';
            showStatus('', '');

            try {
                const cred = await auth.createUserWithEmailAndPassword(ADMIN_EMAIL, ADMIN_PASSWORD);
                const adminsRef = db.collection('config').doc('admins');
                const snap = await adminsRef.get();
                if (snap.exists && snap.data().emails && snap.data().emails.length) {
                    const emails = snap.data().emails;
                    if (!emails.includes(ADMIN_EMAIL) && !emails.includes(ADMIN_EMAIL.toLowerCase())) {
                        emails.push(ADMIN_EMAIL);
                        emails.push(ADMIN_EMAIL.toLowerCase());
                        await adminsRef.update({ emails: emails });
                    }
                } else {
                    await adminsRef.set({ emails: [ADMIN_EMAIL, ADMIN_EMAIL.toLowerCase()] });
                }
                showStatus('Admin account created! Redirecting to admin login...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html#admin';
                }, 2000);
            } catch (err) {
                if (err.code === 'auth/email-already-in-use') {
                    try {
                        await auth.signInWithEmailAndPassword(ADMIN_EMAIL, ADMIN_PASSWORD);
                        const adminsRef = db.collection('config').doc('admins');
                        const snap = await adminsRef.get();
                        if (!snap.exists || !snap.data().emails || !snap.data().emails.length) {
                            await adminsRef.set({ emails: [ADMIN_EMAIL, ADMIN_EMAIL.toLowerCase()] });
                        } else {
                            const emails = snap.data().emails;
                            if (!emails.includes(ADMIN_EMAIL) && !emails.includes(ADMIN_EMAIL.toLowerCase())) {
                                emails.push(ADMIN_EMAIL);
                                emails.push(ADMIN_EMAIL.toLowerCase());
                                await adminsRef.update({ emails: emails });
                            }
                        }
                        showStatus('Admin already existed. Added to config/admins. Redirecting...', 'success');
                        setTimeout(function() { window.location.href = 'index.html#admin'; }, 2000);
                    } catch (e) {
                        if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
                            showStatus('admin@kotapal.com already exists with a different password. Add it manually in Firebase Console → Authentication → Users, or reset the password there.', 'error');
                        } else {
                            showStatus('User exists but could not update config: ' + (e.message || e) + '. Deploy rules: firebase deploy --only firestore', 'error');
                        }
                        btn.disabled = false;
                        btn.textContent = 'Create admin@kotapal.com (Admin123!)';
                    }
                } else {
                    showStatus('Error: ' + (err.message || err) + '. Deploy Firestore rules first: firebase deploy --only firestore', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Create admin@kotapal.com (Admin123!)';
                }
            }
        });
    </script>
</body>
</html>
