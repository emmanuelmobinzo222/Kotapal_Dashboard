# GitHub Pages Configuration
# This file tells GitHub Pages to use the root directory and disable Jekyll processing
theme: null
plugins: []

# Exclude unnecessary files from processing
# NOTE: Do NOT exclude *.html files - index.html is required!
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - .git
  - .gitignore
  - docs
  - src
  - frontend
  - archive
  - data
  - scripts
  - server.js
  - simple-server.js
  - *.bat
  - *.sh
  - verify-firebase-setup.js
  - *.json
  - *.md
  - env.example
  - firebase-key.json
  - .github
  - firebase.json
  - .firebaserc
  - .firebaseignore
