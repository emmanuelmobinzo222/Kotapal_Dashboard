<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redirecting - KotaPal</title>
    <script>
        var p = window.location.pathname.toLowerCase();
        var hash = (p.endsWith('admin') || p.endsWith('admin.html')) ? '#admin' : p.endsWith('admin-setup') ? '#admin-setup' : '';
        window.location.replace('index.html' + hash);
    </script>
    <meta http-equiv="refresh" content="0;url=index.html">
</head>
<body>Redirecting to <a href="index.html">index.html</a>...</body>
</html>
